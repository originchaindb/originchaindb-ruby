name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: "3.2"
          - os: ubuntu-latest
            runtime: "3.4"
          - os: windows-latest
            runtime: "4.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@aad2d1c00761d58c8c408393cea6f6f998991eaf
        with:
          ruby-version: "${{ matrix.runtime }}"
      - name: Check out the shared API v1 contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: originchaindb/.github
          ref: 073b0396db55c903ca114f15fab8cf83c4b92e3d
          path: .contract-reference
          persist-credentials: false
      - name: Verify cross-language contract
        run: python scripts/check_contract.py
      - name: HTTP contract
        run: python tests/contract/run.py -- ruby tests/consumer.rb
      - name: Resilience contract
        run: python tests/contract/resilience.py -- ruby tests/resilience.rb
      - name: Build package
        run: gem build originchaindb.gemspec
      - name: Check example syntax
        run: ruby -c examples/catalog.rb
      - name: Check application integration example
        run: ruby -c examples/integration.rb

      - name: Bounded iteration contract
        run: |
          python tests/contract/iteration.py -- ruby tests/iteration.rb
      - name: Public API compatibility
        run: |
          python scripts/check_api.py -- ruby scripts/api_surface.rb

  quality:
    name: Performance and package verification
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSER_ROOT_VERSION: 1.0.0-rc.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@aad2d1c00761d58c8c408393cea6f6f998991eaf
        with:
          ruby-version: "3.2"
      - name: Prepare SDK and benchmark
        run: |
          ruby --version
          python -m pip install psutil==7.2.2
          mkdir -p artifacts
      - name: Build and install package candidate
        run: |
          gem build originchaindb.gemspec --output artifacts/originchaindb.gem
          python scripts/verify_artifact.py
      - name: Measure transport and check performance baseline
        run: |
          python -c "import json; from pathlib import Path; b=json.loads(Path('benchmarks/baseline.json').read_text()); assert b['platform']=='github-ubuntu24-x64'"
          python benchmarks/run.py --platform github-ubuntu24-x64 --baseline benchmarks/baseline.json --output benchmark-results.json  -- ruby benchmarks/consumer.rb
      - name: Check bulk and pagination example
        run: |
          ruby -c examples/bulk_and_scan.rb
      - name: Record exact artifact hashes
        run: |
          python scripts/artifact_manifest.py
      - name: Retain benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-benchmark
          path: benchmark-results.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain verified package candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-verified-build
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  provenance:
    name: Sign and verify build provenance
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: sdk-verified-build
          path: artifacts
      - name: Attest verified build artifacts
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: artifacts/*
          push-to-registry: false
      - name: Verify signed provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in artifacts/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" --source-digest "$GITHUB_SHA" --source-ref refs/heads/main
          done
      - name: Retain provenance bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-build-provenance
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 14
