name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: "3.2"
          - os: ubuntu-latest
            runtime: "3.4"
          - os: windows-latest
            runtime: "4.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@aad2d1c00761d58c8c408393cea6f6f998991eaf
        with:
          ruby-version: "${{ matrix.runtime }}"
      - name: Check out the shared API v1 contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: originchaindb/.github
          ref: a47804a80fc5b31022d241dc814d905f6f78e723
          path: .contract-reference
          persist-credentials: false
      - name: Verify cross-language contract
        run: python scripts/check_contract.py
      - name: HTTP contract
        run: python tests/contract/run.py -- ruby tests/consumer.rb
      - name: Resilience contract
        run: python tests/contract/resilience.py -- ruby tests/resilience.rb
      - name: Build package
        run: gem build originchaindb.gemspec
      - name: Check example syntax
        run: ruby -c examples/catalog.rb
      - name: Check application integration example
        run: ruby -c examples/integration.rb
